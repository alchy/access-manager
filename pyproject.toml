[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "access-manager"
version = "0.1.0.dev0"
description = "Identita a politika jako samostatna sluzba: kdo jsi a co je napsano."
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jindrich Nemec" }]

# ZADNE POVINNE ZAVISLOSTI. Kdo pouziva klienta, nema duvod instalovat HTTP
# vrstvu ani TOTP - a aplikace, ktera jen prihlasuje lidi, uz vubec ne.
dependencies = []

[project.optional-dependencies]
remote = ["httpx>=0.27"]
totp = ["pyotp>=2.9", "qrcode>=7.4"]
server = ["flask>=3", "waitress>=3"]
dev = [
    "pytest>=8", "httpx>=0.27", "pyotp>=2.9", "qrcode>=7.4", "ruff>=0.6",
    "flask>=3", "waitress>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["access_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
