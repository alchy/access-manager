{% extends "layout.html" %}
{% block content %}
<h1>{{ t('aplikace.key_once') }}</h1>
<p class="poznamka">{{ t('aplikace.key_note') }}</p>

<p>{{ t('aplikace.name') }}: <span class="mono">{{ jmeno }}</span></p>

<p>{{ t('aplikace.key') }}</p>
<p class="mono klic-hodnota" id="klic-hodnota">{{ klic }}</p>
<button type="button"
        onclick="navigator.clipboard.writeText(document.getElementById('klic-hodnota').textContent.trim())">
  {{ t('aplikace.copy') }}
</button>

<p><a href="{{ url_for('_aplikace_seznam') }}">{{ t('spolecne.back') }}</a></p>
{% endblock %}
